# .github/workflows/snapshot.yml
name: Snapshot Space Weather

on:
  schedule:
    # Every 12 hours (00:00 and 12:00 UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch: # allow manual trigger for testing

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger snapshot endpoint (debug)
        run: |
          HTTP_CODE=$(curl -X POST https://spacewx-translator.vercel.app/api/cron/snapshot \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --silent --show-error --output response.txt --write-out "%{http_code}")
          echo "HTTP status: $HTTP_CODE"
          cat response.txt
          if [ "$HTTP_CODE" -ge 400 ]; then exit 1; fi

      - name: Trigger daily summaries endpoint
        run: |
          curl -X POST https://spacewx-translator.vercel.app/api/cron/daily-summaries \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error

      - name: Sync DONKI events
        run: |
          curl -X POST https://spacewx-translator.vercel.app/api/cron/sync-donki \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
